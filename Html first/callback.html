## 1. Food Delivery App 🍕

You are building a food delivery app.

```javascript
function placeOrder(order, callback) {
    console.log("Order placed:", order);
    callback();
}

placeOrder("Pizza", function () {
    console.log("Preparing pizza...");
});
```

**Questions:**

* Is the callback synchronous or asynchronous?
* Is this how a real food delivery app should work? Why or why not?
* How would you make it more realistic?

---

## 2. Downloading a File 📥

When a user downloads a file, it takes a few seconds.

**Question:**
Write a function `downloadFile(callback)` that:

* Prints `"Downloading..."`
* Waits 3 seconds
* Calls the callback
* Callback prints `"Download Complete"`

**Think about:**

* Why is this callback asynchronous?
* What would happen if it were synchronous?

---

## 3. Login System 🔐

Suppose a website checks your username and password from a server.

```javascript
login(username, password, callback);
```

**Questions:**

* Should `callback` be synchronous or asynchronous?
* Why?
* What happens while the server is checking the credentials?

---

## 4. Reading a File 📄 (Node.js)

You're reading a large file from disk.

```javascript
readFile("data.txt", callback);
```

**Questions:**

* Why shouldn't the callback execute immediately?
* What problem would synchronous file reading cause in a web server?

---

## 5. Payment Gateway 💳

A user clicks **Pay Now**.

The payment gateway takes 5 seconds to verify the payment.

**Question:**
Which is better?

### Option A

```javascript
pay(amount, callback);
```

where callback is synchronous.

### Option B

```javascript
pay(amount, callback);
```

where callback runs after the payment is verified.

**Explain your choice.**

## 6. Image Upload 📷

A user uploads a 50 MB image.

**Questions:**

* Should the upload callback be synchronous or asynchronous?
* What can the user do while the image uploads?
* Why is asynchronous programming useful here?

* Sends a welcome email

## 9. Chat Application 💬

**Questions:**

    // Fetch user from database
}
