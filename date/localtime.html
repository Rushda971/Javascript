<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
</head>
<body>
    <h1 id="clock"></h1>

    <script>
        function LocalTime() {
            const d = new Date();

            const date =
                `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth()+1).padStart(2, "0") }/${String(d.getFullYear()).padStart(2, "0")}`;

            const time =
                `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;

            document.getElementById("clock").innerHTML =
                `${date}<br>${time}`;
        }

        LocalTime(); 
        setInterval(LocalTime, 1000); 
    </script>
</body>
</html>
