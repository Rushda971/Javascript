//hoisting--declaring before the scope "JavaScript processes declarations first, then executes code line by line."
//let, const, and class hoisting can lead to errors because they are hoisted without initialization


/*| Declaration Type     | Hoisted       | Initialized   | Usable Before Declaration |
| -------------------- | ------------- | ------------- | ------------------------- |
| `var`                | Yes           | `undefined`   | Yes                       |
| `let`                | Yes           | No            | No                        |
| `const`              | Yes           | No            | No                        |
| Function declaration | Yes           | Full function | Yes                       |
| Function expression  | Variable only | `undefined`   | No                        |
| Class                | Yes           | No            | No                        |*/

/*

`let`, `const`, and `class` hoisting can lead to errors because they are hoisted **without initialization**.
This creates the **Temporal Dead Zone (TDZ)** — the time between entering the scope and the actual declaration line.

Example with `let`:
console.log(a); // ReferenceError
let a = 10;


Here:
* `a` is hoisted
* but not initialized
* accessing it before declaration throws a `ReferenceError`

The same happens with `const`:
console.log(b); // ReferenceError
const b = 20;


And classes:
const p = new Person(); // ReferenceError
class Person {}


By contrast, `var` does **not** throw this error because it is initialized with `undefined` during hoisting.
console.log(x); // undefined
var x = 5;

*/
