<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
    <style>
        button{
            width:80px;
            height:80px;
            border:none;
            border-radius:10%;
            overflow:hidden;
            left:90%;
            position: relative;
            padding:0;
            background: none;
        }
        video{
            display:block; 
            width:100%;
            height:100%;
            object-fit:contain;
        }
        .dark{
            background-color: black;
            color: white;
        }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            min-height: 100vh;
        }
    </style>
<body>


<!-- 
preload="none"      // Kuch bhi pehle load mat karo.
preload="metadata"  // Sirf video ki information load karo.
preload="auto"      // Video ko pehle se load kar lo. 
-->

<!--
 Purpose: Mobile devices (especially iPhone/iPad) par video ko fullscreen mein khulne se rokta hai. -->

<button id="themebtn" onclick="ToggleMode()">
    <video id="btnVideo" preload="auto" muted>
        <source src="DarkMode.webm" type="video/webm">
    </video>
</button>

<script>

    const video = document.getElementById("btnVideo");
    function ToggleMode(){
        //video.currentTime = 0;
        video.play();

        document.body.classList.toggle("dark");

    }
    function resetImage() {
        document.body.classList.remove("dark");
    }

</script>

</body>
</html>
